name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run local checkpoints
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: fake://
        run: >-
          pytest tests/test_cp1.py tests/test_cp2.py tests/test_cp3.py
          tests/test_cp4.py --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --tag day12-agent:ci .

  deploy:
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.RAILWAY_PROJECT_ID != ''
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway
        run: npx --yes @railway/cli@3.19.0 up --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_NAME"
